<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="bootstrap/css/bootstrap.min.css" rel="stylesheet" />
    <link href="css/stylesFunciones.css" rel="stylesheet" />
    <link rel="icon" href="img/js.png" sizes="32x32" type="image/png" />
    <title>Ficha de Estudiantes</title>
</head>

<body>
    <header>
        <div class="px-3 py-2 text-bg-dark fixed-top">
            <div class="container">
                <div class="d-flex flex-wrap align-items-center justify-content-center justify-content-lg-start">
                    <a href="guia6_index.html"
                        class="d-flex align-items-center my-2 my-lg-0 me-lg-auto text-white text-decoration-none">
                        <img src="img/js.png" alt="" width="32" height="32" class="me-2" />
                    </a>
                </div>
            </div>
        </div>
    </header>
    <div class="container-lg">
        <!-- CONTINUAR CON EL CODIGO AQUI -->
        <div class="row">
            <div class="col-12 shadow-lg p-3 mt-5 bg-body rounded">
                <h3>Ficha de Estudiantes </h3>
                <!-- DEBE PEDIR CARNET, NOMBRE COMPLETO, DUI, NIT, FECHA DE NACIMIENTO, CORREO, EDAD -->
                <form id="idForm">
                    <div class="row">
                        <div class="col-lg-6">
                            <div class="form-floating mb-3">
                                <input type="text" class="form-control" id="idTxtCarnet"
                                    placeholder="Carnet del Estudiante">
                                <label for="idTxtCarnet">
                                    <i class="bi bi-person-workspace"></i> Carnet del Estudiante
                                </label>
                            </div>
                        </div>
                        <div class="col-lg-6">
                            <div class="form-floating mb-3">
                                <input type="text" class="form-control" id="idTxtNombre"
                                    placeholder="Nombre del paciente">
                                <label for="idTxtNombre">
                                    <i class="bi bi-person-circle"></i> Nombre completo del Estudiante
                                </label>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-lg-6">
                            <div class="form-floating">
                                <input type="text" class="form-control" id="idTxtDUI" placeholder="Numero de DUI">
                                <label for="idTxtDUI">
                                    <i class="bi bi-person-badge"></i> Numero de DUI
                                </label>
                            </div>
                        </div>

                        <div class="col-lg-6">
                            <div class="form-floating">
                                <input type="text" class="form-control" id="idTxtNIT" placeholder="Numero de NIT">
                                <label for="idTxtNIT">
                                    <i class="bi bi-person-badge"></i> Numero de NIT
                                </label>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-lg-4 pt-3">
                            <div class="form-floating">
                                <input type="text" class="form-control" id="idTxtFechaNacimiento"
                                    placeholder="Fecha de Nacimiento">
                                <label for="idTxtFechaNacimiento">
                                    <i class="bi bi-calendar-date"></i> Fecha de Nacimiento
                                </label>
                            </div>
                        </div>
                        <div class="col-lg-4 pt-3">
                            <div class="form-floating">
                                <input type="text" class="form-control" id="idTxtCorreo"
                                    placeholder="Correo Electronico">
                                <label for="idTxtCorreo">
                                    <i class="bi bi-envelope"></i> Correo Electronico
                                </label>
                            </div>
                        </div>
                        <div class="col-lg-4 pt-3">
                            <div class="form-floating">
                                <input type="text" class="form-control" id="idTxtEdad" placeholder="Edad">
                                <label for="idTxtEdad">
                                    <i class="bi bi-123"></i> Edad
                                </label>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-lg-12 pt-3">
                            <button id="idBtnAgregar" type="button" class="btn btn-success">
                                <i class="bi bi-person-plus-fill"></i> Guardar Datos
                            </button>
                            <button id="idBtnMostrar" type="button" class="btn btn-warning">
                                <i class="bi bi-people"></i> Mostrar Estudiantes
                            </button>
                        </div>
                    </div>
                </form>
            </div>

            <div class="col-12 shadow-lg pt-3 mt-5 bg-body rounded">
                <h3> Estudiantes registrados </h3>
                <div id="idTablaEstudiantes"> Ninguno </div>
            </div>
        </div>


        <!--! MODAL PARA EDITAR -->

        <div class="modal fade" id="idModalEditar" tabindex="-1" aria-labelledby="modalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h1 class="modal-title fs-5" id="modalLabelEditar">Editando paciente</h1>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <form id="idFormEditar">
                            <div class="row">
                                <div class="col-lg-12">
                                    <div class="form-floating mb-3">
                                        <input type="text" class="form-control" id="idTxtCarnetEditar"
                                            placeholder="Carnet del Estudiante">
                                        <label for="idTxtCarnetEditar">
                                            <i class="bi bi-person-workspace"></i> Carnet del Estudiante
                                        </label>
                                    </div>
                                </div>
                            </div>  
                            <div class = "row">
                                <div class="col-lg-12">
                                    <div class="form-floating mb-3">
                                        <input type="text" class="form-control" id="idTxtNombreEditar"
                                            placeholder="Nombre del paciente">
                                        <label for="idTxtNombreEditar">
                                            <i class="bi bi-person-circle"></i> Nombre completo del Estudiante
                                        </label>
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-lg-6">
                                    <div class="form-floating">
                                        <input type="text" class="form-control" id="idTxtDUIEditar"
                                            placeholder="Numero de DUI">
                                        <label for="idTxtDUIEdtar">
                                            <i class="bi bi-person-badge"></i> Numero de DUI
                                        </label>
                                    </div>
                                </div>

                                <div class="col-lg-6">
                                    <div class="form-floating">
                                        <input type="text" class="form-control" id="idTxtNITEditar"
                                            placeholder="Numero de NIT">
                                        <label for="idTxtNITEditar">
                                            <i class="bi bi-person-badge"></i> Numero de NIT
                                        </label>
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-lg-12 pt-3">
                                    <div class="form-floating">
                                        <input type="text" class="form-control" id="idTxtFechaNacimientoEditar"
                                            placeholder="Fecha de Nacimiento">
                                        <label for="idTxtFechaNacimientoEditar">
                                            <i class="bi bi-calendar-date"></i> Fecha de Nacimiento
                                        </label>
                                    </div>
                                </div>
                            </div>  
                            <div class="row"> 
                                <div class="col-lg-8 pt-3">
                                    <div class="form-floating">
                                        <input type="text" class="form-control" id="idTxtCorreoEditar"
                                            placeholder="Correo Electronico">
                                        <label for="idTxtCorreoEditar">
                                            <i class="bi bi-envelope"></i> Correo Electronico
                                        </label>
                                    </div>
                                </div>
                                <div class="col-lg-4 pt-3">
                                    <div class="form-floating">
                                        <input type="text" class="form-control" id="idTxtEdadEditar" placeholder="Edad">
                                        <label for="idTxtEdadEditar">
                                            <i class="bi bi-123"></i> Edad
                                        </label>
                                    </div>
                                </div>
                            </div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-primary" id="idBtnGuardarCambios" data-bs-dismiss="modal">
                            <i class="bi bi-plus-circle"></i> Guardar
                        </button>
                    </div>
                </div>
            </div>
        </div>


        <!--! MOSTRAR NOTIFICACIONES -->
        <div class="toast-container top-0 start-50 translate-middle-x pt-4 mt-1" style="z-index: 1035;">
            <div id="idNotificacion" class="toast text-bg-success" role="alert" aria-live="assertive"
                aria-atomic="true">
                <div class="toast-header">
                    <i class="bi bi-bell"></i>
                    <strong class="me-auto"> Notificación </strong>
                    <small> Hace un momento </small>
                    <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
                </div>
                <div class="toast-body" id="idMensaje">
                </div>
            </div>
        </div>
        <script src="bootstrap/js/bootstrap.bundle.min.js"></script>
        <script src="js/estudiantes.js" defer></script>
</body>

</html>
